name: Deploy Spanish App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: spanish-app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hermes-ai-agent-497702
  REGION: us-east1
  SERVICE: spanish-app
  IMAGE: us-east1-docker.pkg.dev/hermes-ai-agent-497702/tonymuzo-apps/app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Test adaptive recall timer
        run: npm run test:timer

      - name: Test recall prompt has a usable cue
        run: npm run test:prompt

      - name: Test recorder lifecycle
        run: npm run test:recorder

      - name: Test deployment safety contract
        run: npm run test:deploy-workflow

      - name: Verify public API and adaptive timer bundle contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path('src/lib/config.ts').read_text()
          timing = Path('src/lib/recallDuration.ts').read_text()
          prompt = Path('src/lib/recallPrompt.ts').read_text()
          rec = Path('src/components/RecallSession.tsx').read_text()
          docker = Path('Dockerfile.cloudrun').read_text()
          dist = ''.join(p.read_text(errors='ignore') for p in Path('dist/_astro').glob('*.js'))
          assert 'https://api-spanish.tonymuzo.dev' in cfg
          assert 'export const RECALL_SECONDS = 15;' in timing
          assert 'export const MAX_RECALL_SECONDS = 35;' in timing
          assert 'item?.scheduling?.time_limit_seconds' in timing
          assert 'item.prompt_type === "minimal"' in prompt
          assert 'recallPromptText(item, sourceAudioUsable)' in rec
          assert 'sourceAudioUnavailable' in rec
          assert 'itemForDuration(list[i])' in rec
          assert 'recallSecondsFromServer(retry.time_limit_seconds)' in rec
          assert 'https://api-spanish.tonymuzo.dev' in docker
          assert 'https://api-spanish.tonymuzo.dev' in dist
          print('Spanish app routing/adaptive-timer contract verified')
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1074324695821/locations/global/workloadIdentityPools/github-actions/providers/active-timed-recall-app
          service_account: spanish-app-github-deployer@hermes-ai-agent-497702.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and inspect container
        run: |
          docker build -f Dockerfile.cloudrun -t "${IMAGE}" .
          cid=$(docker run -d -p 127.0.0.1:18080:8080 "${IMAGE}")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/session/ -o /tmp/image-session.html; then break; fi
            sleep 1
          done
          EXPECTED_ASSET=$(python3 - <<'PY'
          import re
          text = open('/tmp/image-session.html').read()
          assets = sorted(set(re.findall(r'/_astro/RecallSession\.[^"\']+\.js', text)))
          assert len(assets) == 1, assets
          print(assets[0])
          PY
          )
          curl -fsS "http://127.0.0.1:18080${EXPECTED_ASSET}" -o /tmp/image-recall.js
          python3 - <<'PY'
          text = open('/tmp/image-recall.js').read()
          assert 'time_limit_seconds' in text
          PY
          EXPECTED_SHA=$(sha256sum /tmp/image-recall.js | cut -d' ' -f1)
          echo "EXPECTED_ASSET=${EXPECTED_ASSET}" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
          docker rm -f "$cid" >/dev/null
          trap - EXIT

      - name: Push container and resolve immutable digest
        run: |
          docker push "${IMAGE}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "${DIGEST}"
          IMAGE_REF="${IMAGE%:*}@${DIGEST}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run and move traffic
        run: |
          PREVIOUS_REVISION=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format=json | python3 -c 'import json, sys; traffic = json.load(sys.stdin)["status"]["traffic"]; full = [row.get("revisionName") for row in traffic if row.get("percent") == 100 and row.get("revisionName")]; assert len(full) == 1, f"expected exactly one 100% traffic revision, got {traffic!r}"; print(full[0])')
          test -n "${PREVIOUS_REVISION}"
          echo "PREVIOUS_REVISION=${PREVIOUS_REVISION}" >> "$GITHUB_ENV"
          gcloud run deploy "${SERVICE}" \
            --region "${REGION}" \
            --image "${IMAGE_REF}" \
            --revision-suffix "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --update-env-vars "APP_BUILD_SHA=${GITHUB_SHA},APP_DEPLOY_RUN=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --platform managed \
            --no-traffic \
            --quiet
          LATEST=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.latestCreatedRevisionName)')
          REV_DIGEST=$(gcloud run revisions describe "${LATEST}" --region "${REGION}" --format='value(status.imageDigest)')
          test "${IMAGE_REF}" = "${REV_DIGEST}"
          echo "TRAFFIC_MOVED=1" >> "$GITHUB_ENV"
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions "${LATEST}=100" \
            --quiet
          TRAFFIC_REV=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.traffic[0].revisionName)')
          TRAFFIC_PERCENT=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.traffic[0].percent)')
          test "${TRAFFIC_REV}" = "${LATEST}"
          test "${TRAFFIC_PERCENT}" = "100"
          echo "LATEST_REVISION=${LATEST}" >> "$GITHUB_ENV"

      - name: Verify exact public bundle
        run: |
          verified=0
          for i in {1..24}; do
            curl -LfsS -H 'Cache-Control: no-cache' -A "GitHubActionsVerified/${GITHUB_RUN_ID}" "https://spanish-app.tonymuzo.dev/session/?deploy=${GITHUB_RUN_ID}-${i}" -o /tmp/spanish.html || true
            if grep -Fq "${EXPECTED_ASSET}" /tmp/spanish.html; then
              curl -LfsS -H 'Cache-Control: no-cache' -A "GitHubActionsVerified/${GITHUB_RUN_ID}" "https://spanish-app.tonymuzo.dev${EXPECTED_ASSET}" -o /tmp/live-recall.js
              LIVE_SHA=$(sha256sum /tmp/live-recall.js | cut -d' ' -f1)
              test "${LIVE_SHA}" = "${EXPECTED_SHA}"
              echo "spanish-app.tonymuzo.dev serves ${EXPECTED_ASSET} from ${LATEST_REVISION}"
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = 1
          echo "DEPLOY_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Roll back unverified traffic
        if: ${{ always() && env.TRAFFIC_MOVED == '1' && env.DEPLOY_VERIFIED != '1' }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions "${PREVIOUS_REVISION}=100" \
            --quiet
          ROLLED_BACK_REV=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.traffic[0].revisionName)')
          ROLLED_BACK_PERCENT=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.traffic[0].percent)')
          test "${ROLLED_BACK_REV}" = "${PREVIOUS_REVISION}"
          test "${ROLLED_BACK_PERCENT}" = "100"
          echo "Rolled traffic back to ${PREVIOUS_REVISION} after failed verification"
